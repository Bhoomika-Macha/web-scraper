<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotes Carousel</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Quotes</h1>

    <div class="tabs">
        <button class="tab active" data-tag="all">All</button>
        <button class="tab" data-tag="life">Life</button>
        <button class="tab" data-tag="love">Love</button>
        <button class="tab" data-tag="humor">Humor</button>
        <button class="tab" data-tag="inspirational">Inspirational</button>
    </div>

    <p id="loadingText">Loading quotes...</p>

    <div id="carousel">
        <button id="prevBtn" class="nav-arrow">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="quote-card">
            <p id="quoteText"></p>
            <p id="quoteAuthor"></p>
        </div>

        <button id="nextBtn" class="nav-arrow">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
