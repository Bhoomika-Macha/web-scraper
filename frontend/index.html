<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotes Scraper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Quotes</h1>

<div class="tabs">
    <button class="tab active all" data-tag="all">All</button>

    <button class="tab" data-tag="inspirational">
        Inspirational <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="life">
        Life <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="humor">
        Humor <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="books">
        Books <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="reading">
        Reading <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="friendship">
        Friendship <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="friends">
        Friends <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="love">
        Love <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="truth">
        Truth <i class="fa-solid fa-x"></i>
    </button>
    <button class="tab" data-tag="simile">
        Simile <i class="fa-solid fa-x"></i>
    </button>
</div>

<p id="loadingText">Loading quotes...</p>

<div id="carousel">
    <button id="prevBtn" class="nav-arrow">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="quote-card">
        <p id="quoteText"></p>
        <p id="quoteAuthor"></p>
    </div>

    <button id="nextBtn" class="nav-arrow">
        <i class="fa-solid fa-chevron-right"></i>
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
